name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: true
  NX_DAEMON: false

jobs:
  quality:
    name: Lint, typecheck, unit tests e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # necessário para nx affected

      - uses: pnpm/action-setup@v6 # versão lida de packageManager no package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - name: Formatação
        run: pnpm format:check

      - name: Lint, typecheck, testes e build (projetos afetados)
        run: pnpm nx affected -t lint typecheck test build

  integration:
    name: Testes de integração (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taskflow" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow
      REDIS_URL: redis://localhost:6379
      APP_ORIGIN: http://localhost:4200
      # Segredos efêmeros apenas para o E2E (marcados como dev-only).
      AUTH_ACCESS_TOKEN_KEYS: '{"ci":"dev-only-ci-access-token-key-000000000000000"}'
      AUTH_ACCESS_TOKEN_ACTIVE_KID: ci
      CSRF_SECRET: dev-only-ci-csrf-secret-0000000000000000000000
      LOG_PSEUDONYMIZATION_KEY: dev-only-ci-log-key-00000000000000000000000000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:deploy
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: dist/.playwright/apps/web-e2e
          retention-days: 7

  docker:
    name: Build das imagens
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f infra/docker/api.Dockerfile --target runtime -t taskflow-api:ci .
      - run: docker build -f infra/docker/web.Dockerfile -t taskflow-web:ci .
