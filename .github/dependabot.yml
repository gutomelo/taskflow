version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular', 'angular-eslint']
      nx:
        patterns: ['nx', '@nx/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      testing:
        patterns:
          [
            'vitest',
            '@vitest/*',
            '@playwright/test',
            'testcontainers',
            '@testcontainers/*',
            'supertest',
          ]
      lint-format:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', '@typescript-eslint/*', 'prettier']
    ignore:
      # Fixados por compatibilidade (ADR 0002): Angular 22 exige TypeScript < 6.1.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: ['/infra/docker']
    schedule:
      interval: weekly
