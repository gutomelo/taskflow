# Dependências locais do TaskFlow. Uso: pnpm infra:up (ver docs/development/setup.md).
# Perfil "app" (opcional) sobe também migrate, api e web a partir de infra/docker/.
name: taskflow

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      # PostgreSQL 18+ usa subdiretório por versão dentro de /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # noeviction: chaves de revogação de sessão e jobs do BullMQ nunca podem ser descartadas (ADR 0005).
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_PORT:-56379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP falso para desenvolvimento: UI em http://localhost:58025 (portas não padrão evitam conflito).
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-51025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-58025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: ['app']
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@postgres:5432/${POSTGRES_DB:-taskflow}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: runtime
    environment:
      # NODE_ENV=test: o perfil local usa segredos dev-only, recusados em produção.
      NODE_ENV: test
      API_PORT: 3333
      LOG_LEVEL: info
      TRUST_PROXY: 1
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@postgres:5432/${POSTGRES_DB:-taskflow}
      REDIS_URL: redis://redis:6379
      # Perfil local "app" (simulação de produção na máquina): valores dev-only, nunca reais.
      APP_ORIGIN: http://localhost:${WEB_PORT:-8080}
      AUTH_ACCESS_TOKEN_KEYS: '{"compose-1":"dev-only-compose-access-token-key-0000000000"}'
      AUTH_ACCESS_TOKEN_ACTIVE_KID: compose-1
      CSRF_SECRET: dev-only-compose-csrf-secret-000000000000000
      LOG_PSEUDONYMIZATION_KEY: dev-only-compose-log-key-00000000000000000000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    profiles: ['app']
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      # NODE_ENV=test pelo mesmo motivo da API (perfil local com valores dev-only).
      NODE_ENV: test
      LOG_LEVEL: info
      WORKER_PORT: 3334
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:-taskflow}@postgres:5432/${POSTGRES_DB:-taskflow}
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:${WEB_PORT:-8080}
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: TaskFlow <nao-responda@taskflow.local>
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
