<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>TaskFlow</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="TaskFlow — gestão de projetos e tarefas para equipes." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <!-- Nonce da CSP: o Nginx troca o marcador por um valor aleatório a cada resposta; o
         Angular o aplica aos estilos que injeta (ngCspNonce). O dev server usa o marcador fixo. -->
    <tf-root ngCspNonce="__CSP_NONCE__"></tf-root>
  </body>
</html>
