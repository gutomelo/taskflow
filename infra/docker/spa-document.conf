# Documento HTML da SPA: CSP restrita com nonce por resposta (spec 001, design § Segurança).
# O build traz o marcador __CSP_NONCE__ no atributo ngCspNonce; o Nginx o troca pelo
# $request_id (128 bits aleatórios por requisição), o mesmo valor enviado no header.
# Mantenha a política igual à do dev server (apps/web/project.json, serve.options.headers).
sub_filter_once off;
sub_filter_types text/html;
sub_filter "__CSP_NONCE__" $request_id;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# O nonce muda a cada resposta: o documento nunca pode vir de cache.
add_header Cache-Control "no-store" always;
