# Incluído em cada bloco que define add_header: no Nginx, add_header em um location
# substitui (não soma) os headers herdados do server.
add_header X-Content-Type-Options "nosniff" always;
# Links de e-mail levam o token no fragmento; sem Referer nenhuma URL da SPA vaza para terceiros.
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
