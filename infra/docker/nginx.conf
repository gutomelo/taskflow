server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location ~ ^/(api|health)/ {
    proxy_pass http://api:3333;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  # Arquivos com hash no nome podem ser cacheados indefinidamente.
  location ~* \.(?:js|css|woff2?|svg|ico|png)$ {
    expires 1y;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: rotas do Angular caem no index.html, servido com CSP e nonce por resposta.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/spa-document.conf;
    try_files $uri $uri/ /index.html;
  }
}
